name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AppControlOrganizer.V2.sln -p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build AppControlOrganizer.V2.sln --configuration Release --no-restore --nologo -p:EnableWindowsTargeting=true

      - name: Test
        run: dotnet test AppControlOrganizer.V2.sln --configuration Release --no-build --nologo -p:EnableWindowsTargeting=true

      - name: Audit dependencies
        shell: pwsh
        env:
          EnableWindowsTargeting: "true"
        run: |
          $auditOutput = dotnet list AppControlOrganizer.V2.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $auditOutput

          if ($auditOutput -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable NuGet packages were detected.'
            exit 1
          }

          $cleanProjects = ([regex]::Matches($auditOutput, 'has no vulnerable packages')).Count
          if ($cleanProjects -ne 4) {
            Write-Error "The dependency audit reported $cleanProjects of 4 projects as clean."
            exit 1
          }
