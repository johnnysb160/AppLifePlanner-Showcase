name: AppLifePlanner
options:
  bundleIdPrefix: com.applifeplanner
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  AppLifePlanner:
    type: application
    platform: iOS
    sources:
      - AppLifePlanner
      - Shared
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.applifeplanner.ios
        INFOPLIST_KEY_CFBundleDisplayName: AppLifePlanner
    entitlements:
      path: AppLifePlanner/AppLifePlanner.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.applifeplanner.widget
    dependencies:
      - target: AppLifePlannerRoutineWidget
  AppLifePlannerRoutineWidget:
    type: app-extension
    platform: iOS
    sources:
      - AppLifePlannerRoutineWidget
      - Shared
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.applifeplanner.ios.routine-widget
        INFOPLIST_KEY_CFBundleDisplayName: AppLifePlanner Routine
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AppLifePlannerRoutineWidget/AppLifePlannerRoutineWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.applifeplanner.widget
